services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      PERSISTENCE_PROVIDER: prisma
      AUTH_MODE: headers
      AI_PROVIDER: openai
      EMBEDDING_PROVIDER: openai
      OPENAI_CLASSIFICATION_MODEL: ${OPENAI_CLASSIFICATION_MODEL:-gpt-5.6}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      DATABASE_URL: postgresql://support:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/support_ai_copilot
      REDIS_URL: redis://redis:6379
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-Default Support Organization}
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-default-support}
      DEFAULT_AGENT_EMAIL: ${DEFAULT_AGENT_EMAIL:?DEFAULT_AGENT_EMAIL is required}
      DEFAULT_AGENT_NAME: ${DEFAULT_AGENT_NAME:-Support Lead}
      DEFAULT_AGENT_ROLE: ${DEFAULT_AGENT_ROLE:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      WEB_PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: support_ai_copilot
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_ai_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
